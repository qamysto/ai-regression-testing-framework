services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: regression-postgres
    environment:
      POSTGRES_USER: regression
      POSTGRES_PASSWORD: regression
      POSTGRES_DB: regression_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: regression-redis
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    container_name: regression-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: regression
      MINIO_ROOT_PASSWORD: regression-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
